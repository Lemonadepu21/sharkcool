name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install native development libraries
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev qt6-connectivity-dev dbus
      - name: Test shared driver and native interface
        env:
          GOFLAGS: -mod=vendor
        run: |
          go test -race ./...
          go vet ./...
          node internal/webui/tests/app.test.cjs
          cmake -S desktop -B dist/native-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_TRANSPORT_BRIDGE=ON
          cmake --build dist/native-build -j2
          ctest --test-dir dist/native-build --output-on-failure
      - name: Build Linux packages
        env:
          GOFLAGS: -mod=vendor
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sharkcool-linux
          path: |
            dist/sharkcool-linux-*.tar.gz
            dist/sharkcool-source.tar.gz
            dist/SHA256SUMS
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt development libraries
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'aqt installation failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtconnectivity qtsvg -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Build, test and package native Windows application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -QtRoot "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
      - uses: actions/upload-artifact@v4
        with:
          name: sharkcool-windows-x64
          path: |
            dist/SharkCool-*-windows-x64.zip
            dist/SharkCool-*-windows-x64.zip.sha256
            dist/SharkCool-*-windows-x64-setup.exe
            dist/SharkCool-*-windows-x64-setup.exe.sha256
